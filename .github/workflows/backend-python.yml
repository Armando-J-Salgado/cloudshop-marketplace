name: Backend Python

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-python.yml']
  push:
    branches: [main, development]
    paths: ['backend/**']

permissions:
  contents: read

concurrency:
  group: backend-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # debe coincidir con el runtime de aws_lambda_function

      - name: Verificar sintaxis
        run: python -m compileall -q backend/

      - name: Ruff (solo errores reales, sin reglas de estilo)
        run: |
          pip install --quiet ruff
          ruff check backend/ --select E9,F63,F7,F82 --output-format=github
